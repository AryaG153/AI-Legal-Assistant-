<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NyayaAI | Login</title>

                        "secondary-fixed-dim": "#ffb95f",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#684000",
                        "inverse-on-surface": "#eff1f3",
                        "secondary": "#855300",

                        "tertiary-fixed": "#d3e4fe",

                    "fontFamily": {
                        "headline-md": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],

                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .auth-card {
            background: #ffffff;
            border: 1px solid #E5E7EB;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .input-focus-gold:focus-within {
            border-color: #A66A00;
            box-shadow: 0 0 0 2px rgba(166, 106, 0, 0.1);
        }
        .btn-transition {
            transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
    </style>
</head>
<body class="bg-white text-on-surface font-body-md min-h-screen relative overflow-x-hidden">
<!-- Main Content Container -->
<main class="min-h-screen w-full flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Top Navigation (Language Selector) -->
<div class="absolute top-6 right-6 md:top-10 md:right-10 z-20">
<div class="relative group">
<button aria-label="Select Language" class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-white text-label-sm text-on-surface hover:bg-surface-container-low transition-all duration-300">
<span class="material-symbols-outlined text-lg">language</span>
<span class="">English</span>
<span class="material-symbols-outlined text-lg transition-transform group-hover:rotate-180">expand_more</span>
</button>
<div class="absolute right-0 mt-2 w-40 bg-white border border-outline-variant rounded-xl shadow-xl hidden group-hover:block z-50 overflow-hidden">
<div class="py-1">
<a class="block px-4 py-2 text-label-sm text-on-surface hover:bg-surface-container-low transition-colors" href="#">English</a>
<a class="block px-4 py-2 text-label-sm text-on-surface hover:bg-surface-container-low transition-colors" href="#">Hindi</a>
<a class="block px-4 py-2 text-label-sm text-on-surface hover:bg-surface-container-low transition-colors" href="#">Marathi</a>
</div>
</div>
</div>
</div>
<!-- Login Card -->
<section class="w-full max-w-[520px] z-10">
<!-- Branding -->
<div class="mb-8 flex flex-col items-center text-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center shadow-md mb-4">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">gavel</span>
</div>
<h1 class="text-headline-md text-primary-container tracking-tight">NyayaAI</h1>
<p class="text-body-md text-on-surface-variant mt-1 font-medium">Empowering Justice through Intelligence</p>
</div>
<!-- Form Panel -->
<div class="auth-card p-8 md:p-10 rounded-2xl">
<div class="mb-10">
<h2 class="text-2xl font-bold text-primary-container">Welcome back</h2>
<p class="text-body-md text-on-surface-variant">Sign in to your legal workspace</p>
</div>
<form action="dashboard.html" class="space-y-6" onsubmit="window.location.href='dashboard.html'; return false;">
<!-- Email -->
<div class="space-y-2">
<label class="block text-label-sm font-medium text-on-surface-variant uppercase tracking-wider pl-1" for="email">Email Address</label>
<div class="relative group input-focus-gold border border-outline-variant rounded-xl bg-white transition-all duration-200">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">mail</span>
<input autofocus="" class="w-full pl-12 pr-4 py-3.5 bg-transparent border-none focus:ring-0 text-body-md text-primary-container placeholder:text-on-surface-variant/50" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-label-sm font-medium text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="text-sm text-tertiary hover:underline transition-colors font-medium" href="#">Forgot Password?</a>
</div>
<div class="relative group input-focus-gold border border-outline-variant rounded-xl bg-white transition-all duration-200">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-transparent border-none focus:ring-0 text-body-md text-primary-container placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary-container p-1 transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-xl" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center pt-1">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-outline-variant bg-white transition-all checked:bg-primary-container checked:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:ring-offset-0" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white text-base scale-0 transition-transform peer-checked:scale-100 left-0 top-0 w-full h-full flex items-center justify-center pointer-events-none">check</span>
</div>
<span class="text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember this device</span>
</label>
</div>
<div class="flex flex-col gap-4 pt-2">
<!-- Primary Login -->
<button class="w-full py-4 bg-primary-container text-white font-button rounded-xl hover:bg-[#1E293B] hover:-translate-y-0.5 active:translate-y-0 btn-transition shadow-sm flex items-center justify-center gap-2" type="submit">
<span class="">Log in to Account</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<!-- Google Login -->
<button class="w-full py-4 bg-white border border-outline-variant text-primary-container font-button rounded-xl hover:bg-surface-container-low active:scale-[0.98] btn-transition flex items-center justify-center gap-3" type="button">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-6 text-label-sm text-on-surface-variant font-medium tracking-widest">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Actions -->
<div class="grid grid-cols-2 gap-4">
<a class="py-4 border border-outline-variant rounded-xl font-button text-primary-container text-center hover:bg-surface-container-low active:scale-[0.98] btn-transition flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-xl">person_add</span>
<span class="">Sign Up</span>
</a>
<a class="py-4 border border-tertiary text-tertiary rounded-xl font-button text-center hover:bg-[#A66A00]/5 active:scale-[0.98] btn-transition flex items-center justify-center gap-2" href="dashboard.html">
<span class="material-symbols-outlined text-xl">visibility</span>
<span class="">Guest</span>
</a>
</div>
</div>
</form>
</div>
<!-- Footer Links -->
<p class="mt-10 text-center text-label-sm text-on-surface-variant">
                By continuing, you agree to NyayaAI's 
                <a class="text-primary-container hover:underline font-semibold" href="#">Terms of Service</a> and 
                <a class="text-primary-container hover:underline font-semibold" href="#">Privacy Policy</a>.
            </p>
</section>
</main>
<script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const icon = document.getElementById('passwordIcon');

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
